name: "Dependency Review"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "requirements*.txt"
      - "package*.json"
      - ".github/dependabot.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: "Review dependency changes for vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, Unlicense
          comment-summary-in-pr: always
